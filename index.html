<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1f5" />
    <title>MyTrade</title>
    <script>
      // 在首屏绘制前恢复主题，避免启动页闪一下另一种底色
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('mytrade.theme') || '"light"');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      :root {
        --boot-bg: #eef1f5;
        --boot-card: #ffffff;
        --boot-text: #1a222c;
        --boot-muted: #64707f;
        --boot-line: #e3e8ee;
        --boot-accent: #1f5fd6;
        --boot-up: #0f7a55;
        --boot-down: #c2413a;
      }
      html[data-theme='dark'] {
        --boot-bg: #14161b;
        --boot-card: #1a1d23;
        --boot-text: #e7eaef;
        --boot-muted: #98a2b0;
        --boot-line: #2a2f38;
        --boot-accent: #7ba1ff;
        --boot-up: #3ecf9a;
        --boot-down: #ff7b73;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        opacity: 1;
        transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-card {
        display: flex;
        width: 296px;
        flex-direction: column;
        align-items: center;
        padding: 32px 28px 26px;
        border: 1px solid var(--boot-line);
        border-radius: 16px;
        background: var(--boot-card);
      }
      .boot-mark {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 22px;
      }
      .boot-mark span {
        width: 3px;
        border-radius: 1px;
        background: var(--boot-muted);
      }
      .boot-mark span:nth-child(1) {
        height: 8px;
      }
      .boot-mark span:nth-child(2) {
        height: 14px;
        background: var(--boot-up);
      }
      .boot-mark span:nth-child(3) {
        height: 11px;
      }
      .boot-mark span:nth-child(4) {
        height: 18px;
        background: var(--boot-down);
      }
      .boot-mark span:nth-child(5) {
        height: 15px;
        background: var(--boot-up);
      }
      .boot-title {
        margin-top: 14px;
        font: 500 17px/1.2 "Segoe UI", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
        color: var(--boot-text);
      }
      .boot-sub {
        min-height: 16px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--boot-muted);
      }
      .boot-bar {
        width: 100%;
        height: 2px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 1px;
        background: var(--boot-line);
      }
      .boot-bar i {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-sweep 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(310%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot *::before,
        #boot *::after {
          animation: none !important;
        }
      }
    </style>
    <!-- TradingView Advanced Charts（本地私有库，勿提交）；defer 避免阻塞首屏 -->
    <script defer src="/charting_library/charting_library.standalone.js"></script>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="boot-title">MyTrade</div>
        <div class="boot-sub" id="boot-sub">正在启动本地网关…</div>
        <div class="boot-bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
