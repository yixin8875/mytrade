name: Release

# 打 v* 标签（或手动触发）后，在 GitHub 的 Windows runner 上构建网关 sidecar、
# MSI/NSIS 和更新清单，并创建/更新对应的 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tauri.conf.json 版本 $version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gateway/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # TradingView Charting Library 不随仓库分发（许可限制，且体积很大）。
      # 把它放在一个私有仓库的根目录，用只读 PAT 拉取并解压到这里。
      - name: Restore TradingView charting library
        shell: pwsh
        env:
          LIB_REPO: ${{ secrets.CHARTING_LIBRARY_REPO }}
          LIB_TOKEN: ${{ secrets.CHARTING_LIBRARY_TOKEN }}
        run: |
          if (-not $env:LIB_REPO -or -not $env:LIB_TOKEN) {
            throw "缺少 secrets.CHARTING_LIBRARY_REPO / CHARTING_LIBRARY_TOKEN，见 README「用 GitHub Actions 发布」"
          }
          $headers = @{
            Authorization          = "Bearer $env:LIB_TOKEN"
            Accept                 = "application/vnd.github+json"
            "User-Agent"           = "mytrade-release"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          New-Item -ItemType Directory -Force public/charting_library | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "charting_library.tar.gz"
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:LIB_REPO/tarball/HEAD" `
            -Headers $headers -OutFile $archive
          tar -xzf $archive -C public/charting_library --strip-components=1
          if (-not (Test-Path public/charting_library/charting_library.standalone.js)) {
            throw "图表库解压后缺少 charting_library.standalone.js，请检查私有仓库的目录结构"
          }

      - name: Install Node dependencies
        run: npm ci

      - name: Install gateway build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway/requirements-build.txt

      - name: Build and publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTES: MyTrade ${{ github.ref_name }}：详见提交记录。
        run: npm run release
